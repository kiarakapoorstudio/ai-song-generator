<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create original AI-powered music with SONARA."
  >

  <meta name="theme-color" content="#000000">

  <title>SONARA — AI Music Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

<body>

  ================================= -->

  <header class="navbar">

    <a href="#" class="logo">
      SONARA
    </a>

    <div class="header-right">

      <div
        class="credits-pill"
        id="creditsPill"
      >
        <span class="credits-icon">✦</span>

        <span id="creditsAmount">
          60
        </span>

        <span class="credits-label">
          credits
        </span>
      </div>

      <nav class="nav-links">

        <a href="#create">
          Create
        </a>

        <a href="#songs">
          My Songs
        </a>

        <a href="#pricing">

        </a>

      </nav>

      <button
        class="account-button"
        id="accountButton"
        onclick="openAuthModal()"
      >
        Sign In
      </button>

       HOME
  ================================= -->

      <span>✦</span>
      AI MUSIC CREATOR
    </div>

    <h1>
      Turn your idea<br>
      into a song.
    </h1>

    <p class="subtitle">
      Describe your song in a few words and create
      an original track with your chosen duration,
      genre, language, vocal style and mood.
    </p>


    <!-- ================================
         GENERATOR CARD
    ================================= -->

        <textarea

          maxlength="1000"

        ></textarea>

        <span
          class="char-count"
          id="charCount"
        >
          0 characters
        </span>

      </div>
